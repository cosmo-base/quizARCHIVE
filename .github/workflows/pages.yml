# GitHub Pages への公開（静的書き出し）
# main ブランチへの push、または手動実行で公開する。
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Build
        run: pnpm build
        env:
          # 独自ドメイン（cbquiz.archive.fsif.jp）の直下で公開するため、公開パスは空にする。
          # github.io/<リポジトリ名>/ で公開する場合は /<リポジトリ名> を指定する。
          PAGES_BASE_PATH: ''
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
